<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="pasteup">
<meta name="theme-color" content="#F8F7F4">
<title>pasteup</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link id="touch-icon" rel="apple-touch-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<!-- ============ home ============ -->
<div id="viewHome" class="view on">
  <div class="topbar">
    <div class="app-name">pasteup</div>
    <div class="spacer"></div>
    <button class="pill ghost" id="btnImport">import</button>
    <button class="pill" id="btnNew">new flyer</button>
  </div>
  <div class="home-scroll">
    <div class="home-grid" id="projectGrid"></div>
    <div class="home-empty hint hidden" id="homeEmpty">no flyers yet</div>
  </div>
</div>

<!-- ============ editor ============ -->
<div id="viewEditor" class="view">
  <div class="topbar">
    <button class="icon-btn" id="btnBack" title="projects"><svg width="16" height="16" viewBox="0 0 14 14"><path d="M9 2 L4 7 L9 12"/></svg></button>
    <button class="doc-title" id="docTitle">untitled flyer</button>
    <div class="spacer"></div>
    <button class="icon-btn dim" id="btnUndo" title="undo"><svg width="18" height="18" viewBox="0 0 17 17"><path d="M6 3 L2.5 6.5 L6 10"/><path d="M2.5 6.5 H10 a4 4 0 0 1 4 4 v3"/></svg></button>
    <button class="icon-btn dim" id="btnRedo" title="redo"><svg width="18" height="18" viewBox="0 0 17 17"><path d="M11 3 L14.5 6.5 L11 10"/><path d="M14.5 6.5 H7 a4 4 0 0 0 -4 4 v3"/></svg></button>
    <button class="icon-btn" id="btnExport" title="export"><svg width="18" height="18" viewBox="0 0 16 16"><path d="M8 10.5 V2 M5 5 L8 2 L11 5"/><path d="M3 8.5 V13.5 H13 V8.5"/></svg></button>
  </div>

  <div class="ws" id="ws">
    <div class="canvas-host"><canvas id="fab"></canvas></div>
    <button class="zoom-pill" id="btnZoom">100%</button>
  </div>

  <!-- contextual action bar: contents depend on what's selected -->
  <div class="actionbar" id="actionbar"></div>
</div>

<!-- ============ erase (object removal) ============ -->
<div id="retouch" class="fullmode">
  <div class="rt-top">
    <button class="pill ghost" id="rtCancel">cancel</button>
    <div class="spacer"></div>
    <!-- zoom lives here: masking a small thing on a big photo needs to get close -->
    <div class="zoomer" id="rtZoom">
      <button data-z="out" aria-label="zoom out">&ndash;</button>
      <button data-z="fit" id="rtZoomVal">fit</button>
      <button data-z="in" aria-label="zoom in">+</button>
    </div>
    <div class="spacer"></div>
    <button class="pill" id="rtGo">erase it</button>
  </div>
  <div class="rt-stage" id="rtStage">
    <div class="rt-wrap" id="rtWrap">
      <canvas id="rtImg"></canvas>
      <canvas id="rtMask"></canvas>
    </div>
  </div>
  <div class="rt-bar">
    <div class="rt-title" id="rtHint">paint over what you want gone</div>
    <div class="rt-brush">
      <span class="lbl">brush</span>
      <input type="range" id="rtSize" min="5" max="300" value="120">
      <span class="lbl" id="rtBrushVal">&mdash;</span>
      <span class="rt-dot" id="rtDot"></span>
    </div>
    <div class="rt-tools">
      <button class="pill ghost" id="rtUndo">undo</button>
      <button class="pill ghost" id="rtClear">clear</button>
    </div>
  </div>
</div>

<!-- ============ crop mode ============ -->
<div id="crop" class="fullmode">
  <div class="rt-top">
    <button class="pill ghost" id="cpCancel">cancel</button>
    <div class="spacer"></div>
    <button class="pill" id="cpGo">crop it</button>
  </div>
  <div class="rt-stage" id="cpStage">
    <div class="cp-wrap" id="cpWrap">
      <canvas id="cpImg"></canvas>
      <div class="cp-rect" id="cpRect">
        <span class="cp-h" data-h="nw"></span><span class="cp-h" data-h="ne"></span>
        <span class="cp-h" data-h="sw"></span><span class="cp-h" data-h="se"></span>
      </div>
    </div>
  </div>
  <div class="rt-bar">
    <div class="rt-title" id="cpHint">drag to crop</div>
    <div class="rt-tools">
      <div class="seg" id="cpAspect">
        <button data-r="free" class="on">free</button>
        <button data-r="flyer">flyer</button>
        <button data-r="1">square</button>
        <button data-r="0.8">4:5</button>
      </div>
      <button class="pill ghost" id="cpReset">reset</button>
    </div>
  </div>
</div>

<!-- ============ shared overlays (body level — always above the views) ============ -->
<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <button class="icon-btn sheet-back hidden" id="sheetBack"><svg width="15" height="15" viewBox="0 0 14 14"><path d="M9 2 L4 7 L9 12"/></svg></button>
    <span class="sheet-title" id="sheetTitle"></span>
    <div class="spacer"></div>
    <button class="icon-btn" id="sheetClose"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 3 L11 11 M11 3 L3 11"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div id="toast"></div>

<input type="file" id="fileImage" accept="image/*" class="offscreen">
<input type="file" id="fileProject" accept=".json,application/json" class="offscreen">

<script type="module" src="./js/app.js"></script>
</body>
</html>
